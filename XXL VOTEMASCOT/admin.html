<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXCEND · Admin</title>
<style>
:root{--bg:#0f1020;--card:#1a1c30;--text:#eee;--accent:#f5c542;--sub:#9aa0b5;--border:#2a2d45}
body.light{--bg:#f2f3f7;--card:#ffffff;--text:#1a1c30;--accent:#d4a017;--sub:#555;--border:#e0e0e8}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:.3s}
.theme-toggle{position:fixed;top:16px;right:16px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:14px;z-index:10}
#login{display:flex;flex-direction:column;gap:16px;max-width:400px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;text-align:center}
#login.hidden{display:none}
#login h1{margin:0;color:var(--accent);font-size:22px}
#login p{color:var(--sub);font-size:14px;margin:0}
#login input{padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;text-align:center;outline:none;font-family:monospace;letter-spacing:2px}
#login input:focus{border-color:var(--accent)}
#login button{padding:14px;border-radius:10px;border:none;background:var(--accent);color:#1a1c30;font-weight:700;font-size:15px;cursor:pointer;transition:.2s}
#login button:hover{filter:brightness(1.1)}
#loginMsg{color:#ff5c5c;font-size:13px;min-height:18px}
#admin{display:none;width:100%;max-width:600px}
#admin.visible{display:block}
.panel{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:24px;max-height:90vh;overflow-y:auto}
.panel h2{margin:0 0 8px;color:var(--accent);text-align:center;font-size:22px}
.panel .sub{text-align:center;color:var(--sub);font-size:12px;margin:0 0 20px}
.section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.section h3{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin:0 0 12px}
.section p{margin:6px 0;font-size:14px}
.section p span{color:var(--accent);font-weight:700}
.btn{display:block;width:100%;padding:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;margin-bottom:8px;transition:.2s;text-align:left;font-family:inherit}
.btn:hover{border-color:var(--accent);background:var(--card)}
.btn-danger{border-color:#ff5c5c;color:#ff5c5c}
.btn-danger:hover{background:#3a1a1a}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 6px}
input[type="text"],input[type="number"],input[type="datetime-local"]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:8px;outline:none;color-scheme:dark;font-family:inherit}
body.light input{color-scheme:light}
input:focus{border-color:var(--accent)}
.status-ok{color:#4CAF50}
.status-no{color:#ff5c5c}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">&#9788; Tema</button>

<div id="login">
  <h1>🔧 AXCEND Admin</h1>
  <p>Introduce la clave de administrador</p>
  <input type="password" id="keyword" placeholder="• • • • • • • • •" autocomplete="off" spellcheck="false">
  <button id="loginBtn">Acceder</button>
  <div id="loginMsg"></div>
</div>

<div id="admin">
  <div class="panel">
    <h2>🔧 Panel de Admin</h2>
    <p class="sub">Sesión activa</p>

    <div class="section">
      <h3>Estado</h3>
      <p>Votos emitidos: <span id="aVotantes">-</span> / <span id="aMiembros">-</span></p>
      <p>Votación cerrada: <span id="aCerrada">-</span></p>
      <p>Fecha límite: <span id="aFechaActual">-</span></p>
    </div>

    <div class="section">
      <h3>Acciones</h3>
      <button class="btn" id="btnCerrarAhora">⛔ Cerrar votación ahora</button>
      <button class="btn" id="btnReabrir">🔓 Reabrir votación (sin límite)</button>
      <button class="btn btn-danger" id="btnResetTotal">💥 Reset TOTAL (votos a 0 + libera a todos)</button>
    </div>

    <div class="section">
      <h3>Fecha límite</h3>
      <label for="inputFecha">Fecha y hora de cierre:</label>
      <input type="datetime-local" id="inputFecha">
      <button class="btn" id="btnGuardarFecha">💾 Guardar fecha límite</button>
      <button class="btn btn-danger" id="btnQuitarFecha">🗑 Quitar fecha límite</button>
    </div>

    <div class="section">
      <h3>Configuración</h3>
      <label for="inputMiembros">Total de miembros del clan:</label>
      <input type="number" id="inputMiembros" min="1" placeholder="40">
      <button class="btn" id="btnGuardarMiembros">Guardar miembros</button>

      <label for="inputMensaje">Mensaje de la cabecera (vacío = oculto):</label>
      <input type="text" id="inputMensaje" maxlength="200" placeholder="Ej: Votación abierta hasta el 31/12">
      <button class="btn" id="btnGuardarMensaje">Guardar mensaje</button>
    </div>

    <div class="section">
      <h3>Sesión</h3>
      <button class="btn" id="btnCerrarSesion">🚪 Cerrar sesión de admin</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBaKgNmCCTdFoE2YkU1B4a8AjnwwGFeBJ4",
    authDomain: "axcend-votemascot-fcced.firebaseapp.com",
    databaseURL: "https://axcend-votemascot-fcced-default-rtdb.firebaseio.com",
    projectId: "axcend-votemascot-fcced",
    storageBucket: "axcend-votemascot-fcced.firebasestorage.app",
    messagingSenderId: "2042810164",
    appId: "1:2042810164:web:8880abb1729053ca8a1f61"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let isAdmin = false;
  let finVotacion = 0;

  function aplicarTema() {
    const saved = localStorage.getItem("axcend_admin_theme");
    if (saved === "light") document.body.classList.add("light");
    else if (saved === "dark") document.body.classList.remove("light");
    else if (!window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add("light");
  }
  window.toggleTheme = function() {
    document.body.classList.toggle("light");
    localStorage.setItem("axcend_admin_theme", document.body.classList.contains("light") ? "light" : "dark");
  };
  aplicarTema();

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const loginDiv = document.getElementById("login");
  const adminDiv = document.getElementById("admin");
  const loginMsg = document.getElementById("loginMsg");
  const keywordInput = document.getElementById("keyword");

  document.getElementById("loginBtn").addEventListener("click", intentarLogin);
  keywordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") intentarLogin(); });

  async function intentarLogin() {
    loginMsg.textContent = "";
    const valor = keywordInput.value.trim();
    if (!valor) return;

    try {
      const snap = await get(ref(db, "config/admin_key_hash"));
      if (!snap.exists()) {
        loginMsg.textContent = "⚠️ No hay hash configurado en Firebase.";
        return;
      }
      const hashEsperado = String(snap.val()).trim().toLowerCase();
      const hashIngresado = await sha256(valor);

      if (hashIngresado === hashEsperado) {
        isAdmin = true;
        loginDiv.classList.add("hidden");
        adminDiv.classList.add("visible");
        iniciarPanel();
      } else {
        loginMsg.textContent = "❌ Clave incorrecta.";
        keywordInput.value = "";
      }
    } catch (err) {
      loginMsg.textContent = "❌ Error: " + err.message;
    }
  }

  function iniciarPanel() {
    onValue(ref(db, "config"), (snap) => {
      if (!snap.exists()) return;
      const c = snap.val();
      finVotacion = c.fin_votacion || 0;
      document.getElementById("aMiembros").textContent = c.total_miembros || 40;

      const cerrada = finVotacion > 0 && Date.now() >= finVotacion;
      const elCerrada = document.getElementById("aCerrada");
      elCerrada.textContent = cerrada ? "Sí" : "No";
      elCerrada.className = cerrada ? "status-no" : "status-ok";

      document.getElementById("inputMiembros").value = c.total_miembros || 40;
      document.getElementById("inputMensaje").value = c.mensaje || "";

      const inpF = document.getElementById("inputFecha");
      const txtF = document.getElementById("aFechaActual");
      if (c.fin_votacion && c.fin_votacion > 1) {
        inpF.value = tsToLocalInput(c.fin_votacion);
        txtF.textContent = formatearFechaBonita(c.fin_votacion);
      } else {
        inpF.value = "";
        txtF.textContent = "Sin fecha límite";
      }
    });

    onValue(ref(db, "votantes"), (snap) => {
      const count = snap.exists() ? Object.keys(snap.val()).length : 0;
      document.getElementById("aVotantes").textContent = count;
    });
  }

  function tsToLocalInput(ts) {
    const d = new Date(ts);
    const off = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - off).toISOString().slice(0, 16);
  }
  function formatearFechaBonita(ts) {
    return new Date(ts).toLocaleString("es-ES", {
      day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }

  function accionResetTotal() {
    if (!isAdmin) return;
    if (!confirm("⚠️ RESET TOTAL\n\nEsto pondrá TODOS los votos a 0 y liberará a todos los votantes.\n\n¿Continuar?")) return;
    if (!confirm("¿Estás TOTALMENTE seguro? Esta acción no se puede deshacer.")) return;

    get(ref(db, "votos")).then((snap) => {
      const votosActuales = snap.val() || {};
      const votosVacios = {};
      Object.keys(votosActuales).forEach(k => votosVacios[k] = 0);
      Promise.all([
        set(ref(db, "votos"), votosVacios),
        remove(ref(db, "votantes")),
        set(ref(db, "config/reset_token"), "v" + Date.now())
      ]).then(() => alert("✅ Reset total completado."))
        .catch(err => alert("❌ " + err.message));
    });
  }

  function accionCerrarAhora() {
    if (!isAdmin) return;
    if (!confirm("¿Cerrar la votación AHORA?")) return;
    set(ref(db, "config/fin_votacion"), Date.now() - 1).then(() => alert("✅ Votación cerrada."));
  }

  function accionReabrir() {
    if (!isAdmin) return;
    if (!confirm("¿Reabrir la votación sin límite?")) return;
    set(ref(db, "config/fin_votacion"), 0).then(() => alert("✅ Votación reabierta."));
  }

  function accionGuardarFecha() {
    if (!isAdmin) return;
    const val = document.getElementById("inputFecha").value;
    if (!val) { alert("Selecciona fecha y hora."); return; }
    const ts = new Date(val).getTime();
    if (isNaN(ts)) { alert("Fecha inválida."); return; }
    if (ts <= Date.now()) {
      if (!confirm("⚠️ La fecha ya pasó. La votación se cerrará de inmediato. ¿Continuar?")) return;
    }
    set(ref(db, "config/fin_votacion"), ts).then(() => alert("✅ Fecha guardada:\n" + formatearFechaBonita(ts)));
  }

  function accionQuitarFecha() {
    if (!isAdmin) return;
    if (!confirm("¿Quitar fecha límite?")) return;
    set(ref(db, "config/fin_votacion"), 0).then(() => alert("✅ Fecha eliminada."));
  }

  function accionGuardarMiembros() {
    if (!isAdmin) return;
    const val = parseInt(document.getElementById("inputMiembros").value);
    if (!val || val < 1) { alert("Número inválido."); return; }
    set(ref(db, "config/total_miembros"), val).then(() => alert("✅ Miembros actualizados a " + val));
  }

  function accionGuardarMensaje() {
    if (!isAdmin) return;
    const val = document.getElementById("inputMensaje").value.trim();
    set(ref(db, "config/mensaje"), val).then(() => alert(val ? "✅ Mensaje guardado." : "✅ Mensaje borrado."));
  }

  function accionCerrarSesion() {
    isAdmin = false;
    adminDiv.classList.remove("visible");
    loginDiv.classList.remove("hidden");
    keywordInput.value = "";
    loginMsg.textContent = "";
  }

  document.getElementById("btnResetTotal").addEventListener("click", accionResetTotal);
  document.getElementById("btnCerrarAhora").addEventListener("click", accionCerrarAhora);
  document.getElementById("btnReabrir").addEventListener("click", accionReabrir);
  document.getElementById("btnGuardarFecha").addEventListener("click", accionGuardarFecha);
  document.getElementById("btnQuitarFecha").addEventListener("click", accionQuitarFecha);
  document.getElementById("btnGuardarMiembros").addEventListener("click", accionGuardarMiembros);
  document.getElementById("btnGuardarMensaje").addEventListener("click", accionGuardarMensaje);
  document.getElementById("btnCerrarSesion").addEventListener("click", accionCerrarSesion);
</script>
</body>
</html>
